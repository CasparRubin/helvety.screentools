version: 2
updates:
  # Keeps the SHA-pinned workflow actions current (Dependabot updates the version comments too).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: /helvety.screentools
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns:
          - "*"
